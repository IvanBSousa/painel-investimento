quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5430}/${POSTGRES_DB}
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.devservices.enabled=false
quarkus.datasource.health.enabled=true
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

# Tests use an isolated PostgreSQL container, never the local database.
%test.quarkus.datasource.jdbc.url=
%test.quarkus.datasource.username=quarkus
%test.quarkus.datasource.password=quarkus
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Redis cache: bounded lifetime also covers changes made outside this application.
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.password=${REDIS_PASSWORD}
quarkus.redis.timeout=PT3S
quarkus.redis.devservices.enabled=false
quarkus.cache.redis.prefix=painel-investimento:cache:{cache-name}
quarkus.cache.redis.expire-after-write=${CACHE_TTL:PT5M}
quarkus.cache.redis.telemetria.expire-after-write=${CACHE_TELEMETRIA_TTL:PT30S}
quarkus.cache.redis.invalidation-scan-size=100

%test.quarkus.redis.hosts=
%test.quarkus.redis.password=
%test.quarkus.redis.devservices.enabled=true
%test.quarkus.redis.devservices.image-name=redis:7.4-alpine

# JWT Configuration
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=caixaverso
smallrye.jwt.sign.key.location=privateKey.pem
quarkus.http.auth.permission.unauthenticated.paths=/,/auth/login,/swagger-ui/*,/q/swagger-ui/*
quarkus.http.auth.permission.unauthenticated.policy=permit
quarkus.http.auth.proactive=false
